<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="方程式と等式の性質">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a33"/><stop offset="1" stop-color="#060f16"/>
    </linearGradient>
    <radialGradient id="gE" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#8fd8ef" stop-opacity="0.28"/><stop offset="1" stop-color="#8fd8ef" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="640" fill="url(#bgE)"/>
  <rect width="900" height="640" fill="url(#gE)"/>

  <g transform="translate(450 180)" fill="none" stroke="#8fd8ef" stroke-width="3.4" stroke-linecap="round">
    <line x1="-250" y1="0" x2="250" y2="0"/>
    <line x1="0" y1="0" x2="0" y2="70"/>
    <path d="M-40 110l40-40 40 40z" stroke-opacity="0.85"/>
    <g stroke-opacity="0.8">
      <line x1="-250" y1="0" x2="-250" y2="46"/>
      <line x1="250" y1="0" x2="250" y2="46"/>
      <rect x="-330" y="46" width="160" height="66" rx="10"/>
      <rect x="170" y="46" width="160" height="66" rx="10"/>
    </g>
  </g>
  <g fill="#8fd8ef" font-family="Georgia, serif" font-style="italic" font-size="34" text-anchor="middle" fill-opacity="0.95">
    <text x="200" y="270">2x + 3</text>
    <text x="700" y="270">11</text>
  </g>

  <g fill="#edf3fb" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="70" y="440" font-size="52" fill-opacity="0.85">2x + 3 = 11</text>
    <text x="70" y="512" font-size="40" fill-opacity="0.42">x + 2y = 7</text>
    <text x="70" y="572" font-size="40" fill-opacity="0.42">3x − y = 7</text>
  </g>
  <path d="M52 486v104" stroke="#8fd8ef" stroke-width="4" stroke-opacity="0.6" fill="none"/>
</svg>
