<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="数と式の計算">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12213a"/><stop offset="1" stop-color="#070d1a"/>
    </linearGradient>
    <radialGradient id="gA" cx="0.72" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#75aaff" stop-opacity="0.30"/><stop offset="1" stop-color="#75aaff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="640" fill="url(#bgA)"/>
  <rect width="900" height="640" fill="url(#gA)"/>

  <g transform="translate(560 150)">
    <line x1="-60" y1="60" x2="300" y2="60" stroke="#a9c9ff" stroke-opacity="0.5" stroke-width="3"/>
    <g fill="#a9c9ff" fill-opacity="0.9" font-family="Georgia, serif" font-size="26" text-anchor="middle">
      <text x="0" y="100">−3</text><text x="90" y="100">−1</text><text x="180" y="100">0</text><text x="270" y="100">2</text>
    </g>
    <g stroke="#a9c9ff" stroke-opacity="0.7" stroke-width="3">
      <line x1="0" y1="52" x2="0" y2="68"/><line x1="90" y1="52" x2="90" y2="68"/>
      <line x1="180" y1="46" x2="180" y2="74"/><line x1="270" y1="52" x2="270" y2="68"/>
    </g>
    <circle cx="270" cy="60" r="9" fill="#79ddc3"/>
  </g>

  <g fill="#edf3fb" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="70" y="330" font-size="70" fill-opacity="0.92">3a + 2b</text>
    <text x="70" y="424" font-size="46" fill-opacity="0.5">−2(a − 3b)</text>
    <text x="70" y="500" font-size="34" fill-opacity="0.3">= a + 8b</text>
  </g>
  <path d="M70 360h250" stroke="#79ddc3" stroke-width="3" stroke-opacity="0.55"/>
</svg>
