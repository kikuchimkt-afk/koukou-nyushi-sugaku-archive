<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="文字式と規則性">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12213a"/><stop offset="1" stop-color="#070d1a"/>
    </linearGradient>
    <radialGradient id="gA" cx="0.72" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#75aaff" stop-opacity="0.30"/><stop offset="1" stop-color="#75aaff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="640" fill="url(#bgA)"/>
  <rect width="900" height="640" fill="url(#gA)"/>
  <g stroke="#a9c9ff" fill="none" stroke-width="2.4" stroke-opacity="0.5">
    <g transform="translate(500 150)">
      <path d="M0 0h70v70H0z"/><path d="M90 0h70v70H90z"/><path d="M180 0h70v70h-70z"/>
      <path d="M0 90h70v70H0z" stroke-opacity="0.32"/><path d="M90 90h70v70H90z" stroke-opacity="0.32"/><path d="M180 90h70v70h-70z" stroke-opacity="0.32"/>
      <path d="M0 180h70v70H0z" stroke-opacity="0.18"/><path d="M90 180h70v70H90z" stroke-opacity="0.18"/><path d="M180 180h70v70h-70z" stroke-opacity="0.18"/>
    </g>
  </g>
  <g fill="#a9c9ff" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="536" y="196" font-size="34" fill-opacity="0.85">n</text>
    <text x="626" y="196" font-size="34" fill-opacity="0.85">n+1</text>
    <text x="716" y="196" font-size="34" fill-opacity="0.85">n+2</text>
  </g>
  <g fill="#edf3fb" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="70" y="300" font-size="66" fill-opacity="0.9">3n + 2</text>
    <text x="70" y="392" font-size="42" fill-opacity="0.42">= 4(n − 1) + 6</text>
    <text x="70" y="470" font-size="30" fill-opacity="0.26">2x + 3y = 12</text>
