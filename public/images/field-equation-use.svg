<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="方程式の利用と線分図">
  <defs>
    <linearGradient id="bgU" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2b26"/><stop offset="1" stop-color="#060f11"/>
    </linearGradient>
    <radialGradient id="gU" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#79ddc3" stop-opacity="0.26"/><stop offset="1" stop-color="#79ddc3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="640" fill="url(#bgU)"/>
  <rect width="900" height="640" fill="url(#gU)"/>

  <g transform="translate(80 180)">
    <rect x="0" y="0" width="300" height="58" rx="8" fill="#79ddc3" fill-opacity="0.22" stroke="#79ddc3" stroke-width="2.6"/>
    <rect x="300" y="0" width="180" height="58" rx="8" fill="none" stroke="#79ddc3" stroke-width="2.6" stroke-opacity="0.55"/>
    <g stroke="#edf3fb" stroke-opacity="0.5" stroke-width="2">
      <line x1="0" y1="86" x2="0" y2="104"/><line x1="480" y1="86" x2="480" y2="104"/><line x1="0" y1="95" x2="480" y2="95"/>
    </g>
    <text x="150" y="38" font-size="30" fill="#edf3fb" fill-opacity="0.9" text-anchor="middle" font-family="Georgia, serif" font-style="italic">x km</text>
    <text x="390" y="38" font-size="26" fill="#edf3fb" fill-opacity="0.6" text-anchor="middle" font-family="Georgia, serif" font-style="italic">12 − x</text>
    <text x="240" y="136" font-size="26" fill="#edf3fb" fill-opacity="0.55" text-anchor="middle">全体 12 km</text>
  </g>

  <g fill="#edf3fb" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="80" y="430" font-size="44" fill-opacity="0.9">x</text>
    <text x="118" y="430" font-size="44" fill-opacity="0.9">/</text>
    <text x="146" y="430" font-size="44" fill-opacity="0.9">4</text>
    <text x="200" y="430" font-size="44" fill-opacity="0.9">+</text>
    <text x="252" y="430" font-size="44" fill-opacity="0.9">(12 − x) / 6 = 2.5</text>
  </g>
  <text x="80" y="516" font-size="30" fill="#79ddc3" fill-opacity="0.62" font-family="Georgia, serif">（速さ・割合・図形への利用）</text>
</svg>
