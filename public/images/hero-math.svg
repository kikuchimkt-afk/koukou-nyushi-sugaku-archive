<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="座標平面と一次関数のグラフ">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1729"/>
      <stop offset="0.55" stop-color="#08101f"/>
      <stop offset="1" stop-color="#050a13"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.24" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#75aaff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#75aaff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.82" cy="0.72" r="0.45">
      <stop offset="0" stop-color="#79ddc3" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#79ddc3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#b6cbe7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="gridFine" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#b6cbe7" stroke-opacity="0.035" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#gridFine)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glowA)"/>
  <rect width="1920" height="1080" fill="url(#glowB)"/>

  <g transform="translate(1180 540)">
    <line x1="-460" y1="0" x2="470" y2="0" stroke="#a7b7cc" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="0" y1="400" x2="0" y2="-420" stroke="#a7b7cc" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M470 0l-14 -7v14z" fill="#a7b7cc" fill-opacity="0.5"/>
    <path d="M0 -420l-7 14h14z" fill="#a7b7cc" fill-opacity="0.5"/>

    <path d="M-420 224L420 -224" fill="none" stroke="#a9c9ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M-360 -300C-200 -150 -60 60 90 300" fill="none" stroke="#79ddc3" stroke-width="3.5" stroke-opacity="0.85" stroke-linecap="round"/>
    <path d="M-420 300Q0 -380 420 300" fill="none" stroke="#e4ba78" stroke-width="3" stroke-opacity="0.55" stroke-dasharray="10 12" stroke-linecap="round"/>

    <circle cx="-180" cy="96" r="9" fill="#a9c9ff"/>
    <circle cx="180" cy="-96" r="9" fill="#a9c9ff"/>
    <circle cx="0" cy="0" r="7" fill="#edf3fb" fill-opacity="0.85"/>
    <g stroke="#a9c9ff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 8">
      <line x1="180" y1="-96" x2="180" y2="0"/>
      <line x1="180" y1="-96" x2="0" y2="-96"/>
    </g>
  </g>

  <g transform="translate(430 620)" fill="none" stroke-linejoin="round">
    <path d="M0 210L190 -140L380 210Z" stroke="#a9c9ff" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M190 -140L190 210" stroke="#a9c9ff" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="8 10"/>
    <path d="M168 210v-22h22" stroke="#a9c9ff" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="190" cy="60" r="176" stroke="#a89cf5" stroke-opacity="0.32" stroke-width="2.5"/>
    <path d="M-40 -230A300 300 0 0 1 250 -300" stroke="#79ddc3" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="7 9"/>
  </g>

  <g transform="translate(250 250)" fill="#edf3fb" fill-opacity="0.14" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="0" y="0" font-size="76">y = ax + b</text>
    <text x="760" y="620" font-size="60" fill-opacity="0.10">a² + b² = c²</text>
  </g>
</svg>
